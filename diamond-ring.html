<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diamond Ring · ASCII</title>
<style>
:root{--fg:#d9dde3;--dim:#5b6068;--pink:#ff7aa8;--kw:#ff6b9a;--fn:#7fb2ff;--num:#f2c46d;--str:#a8d58a;--cm:#5d6470}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--fg);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#000}
#stage{position:relative;flex:1;min-height:0}
#bar,#code,#hud,#clock{display:none}
#msg{position:absolute;left:0;right:0;text-align:center;font-size:clamp(16px,4.6vw,21px);letter-spacing:.14em;color:#eef2fb;opacity:0;pointer-events:none;text-shadow:0 0 6px rgba(200,215,255,.9),0 0 18px rgba(160,185,255,.55);white-space:nowrap}
canvas{position:absolute;inset:0;width:100%;height:100%}
#glow{filter:blur(4px) brightness(1.9);opacity:.85}
#clock{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;font-size:11px;color:var(--pink)}
#hud{position:absolute;left:14px;bottom:8px;font-size:10px;line-height:1.55;color:var(--dim);white-space:pre}
#bar{display:flex;justify-content:space-between;padding:6px 14px;font-size:10px;color:var(--dim);border-bottom:1px solid #1b1d21}
#code{flex:1;min-height:0;overflow:hidden;padding:8px 0;font-size:12.5px;line-height:1.7;position:relative}
#code:before{content:"";position:absolute;left:0;right:0;top:0;height:44px;background:linear-gradient(#000,transparent);z-index:2;pointer-events:none}
.ln{display:flex;white-space:pre;padding-right:10px}
.ln .n{flex:0 0 38px;text-align:right;padding-right:14px;color:#3d4148}
.ln.cur{background:rgba(255,122,168,.09)}
.ln.cur .n{color:var(--pink)}
.k{color:var(--kw)}.f{color:var(--fn)}.d{color:var(--num)}.s{color:var(--str)}.c{color:var(--cm)}
.caret{display:inline-block;width:7px;height:1.1em;background:var(--pink);vertical-align:text-bottom;margin-left:1px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="glow"></canvas>
    <canvas id="main"></canvas>
    <div id="msg">Надтай үерхээч</div>
    <div id="clock"></div>
    <div id="hud"></div>
  </div>
</div>

const CODE = `"""art.py - a diamond ring, drawn in letters by light"""
import numpy as np

TAU = np.pi * 2
LOOP, FPS = 19.5, 30

# -- the ring ------------------------------------------------

R_BAND = 1.00                       # band centre radius
BAND_A, BAND_C = 0.115, 0.130       # half width, half depth
GIRDLE_Y, TABLE_Y, CULET_Y = 1.50, 1.74, 1.02

def rounded_rect(a, c, r, m):
    """band cross-section: m points, equal arc length"""
    path = lines(a, c) + arcs(r)
    return resample(path, m)

function camera(x, y, z, ang) {          // spin about Y, then tilt about X
  const cA = Math.cos(ang), sA = Math.sin(ang);
  const x1 = x * cA + z * sA, z1 = -x * sA + z * cA;
  return [x1, y * cT - z1 * sT, y * sT + z1 * cT];
}
const ORB_N = 520, ORB_A = 2.05, ORB_B = 0.62;
function orbitPoint(e, th, t) {
  const rz = (e ? 1 : -1) * 0.52, cr = Math.cos(rz), sr = Math.sin(rz);
  const x = ORB_A * Math.cos(th), y = ORB_B * Math.sin(th);
  const x1 = x * cr - y * sr, y1 = x * sr + y * cr;
  const y2 = y1 * 0.9 + 0.45, z2 = y1 * 0.43;
  const pr = 0.4 * Math.sin(t * 0.33 + e * 2), cp = Math.cos(pr), sp = Math.sin(pr);
  const x3 = x1 * cp + z2 * sp, z3 = -x1 * sp + z2 * cp;
  return [x3, y2 * cT - z3 * sT, y2 * sT + z3 * cT];
}

/* ================= frame ================= */
let tStart = performance.now(), last = 0, fr = 0;
const q = new URLSearchParams(location.search);
const FIXED = q.has("t") ? parseFloat(q.get("t")) : null;
window.addEventListener("pointerdown", () => { tStart = performance.now(); });
window.addEventListener("resize", () => { resize(); });
resize();

function frame(now) {
  requestAnimationFrame(frame);
  if (FIXED === null && now - last < 33) return; last = now; fr++;
  const t = FIXED !== null ? FIXED : ((now - tStart) / 1000) % LOOP;
  GA = 1 - smooth((t - (LOOP - FADE)) / FADE);
  const head = clamp((t - DRAW0) / (DRAW1 - DRAW0), 0, 1) * ORDER_MAX;
  const ang = TAU * Math.max(t - SPIN0, 0) / TURN;
  const cA = Math.cos(ang), sA = Math.sin(ang);
  const rim = V.norm([Math.cos(t * 0.9), 0.5, Math.sin(t * 0.9)]);
  const hv = V.norm([key[0], key[1], key[2] + 1]);

  zb.fill(-1e9); kb.fill(0); arr.fill(0); spb.fill(0);
  let glints = 0;

  /* ---- splat the point cloud into the z-buffered letter grid ---- */
  for (let i = 0; i < N; i++) {
    let k = (head - aORD[i] + 0.08) / 0.28;
    if (k <= 0) continue; if (k > 1) k = 1;
    const ks = k * k * (3 - 2 * k), w = (1 - ks) * (1 - ks);
    const x = aPX[i] + aOFX[i] * w, y = aPY[i] + aOFY[i] * w, z = aPZ[i] + aOFZ[i] * w;
    const x1 = x * cA + z * sA, z1 = -x * sA + z * cA;
    const y2 = y * cT - z1 * sT, z2 = y * sT + z1 * cT;
    const f = D_CAM / (D_CAM - z2);
    const col = Math.floor((CX + x1 * S * f) / CW), row = Math.floor((CY - (y2 - Y0) * S * f) / CH);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) continue;
    const idx = row * COLS + col;
    if (z2 <= zb[idx]) continue;
    const nx1 = aNX[i] * cA + aNZ[i] * sA, nz1 = -aNX[i] * sA + aNZ[i] * cA;
    const ny2 = aNY[i] * cT - nz1 * sT, nz2 = aNY[i] * sT + nz1 * cT;
    const kd = aKIND[i], sd = aSEED[i];
    const lam = Math.max(0, key[0] * nx1 + key[1] * ny2 + key[2] * nz2);
    const rd = Math.max(0, rim[0] * nx1 + rim[1] * ny2 + rim[2] * nz2);
    const rx = 2 * nz2 * nx1, ry = 2 * nz2 * ny2;
    let b, sp = 0;
    if (kd === KG) {
      const envG = Math.pow(0.5 + 0.5 * Math.sin(ry * 9 + rx * 7 + sd * 6.283 + t * 0.4), 4);
      sp = Math.pow(Math.max(0, Math.sin(t * (2.5 + sd * 5) + sd * 40)), 14);
      const spec = Math.pow(Math.max(0, hv[0] * nx1 + hv[1] * ny2 + hv[2] * nz2), 28);
      b = 0.2 + 0.25 * lam + 0.75 * envG + 0.3 * Math.pow(rd, 2) + 1.2 * sp + 0.9 * spec;
      if (sp > 0.55 || spec > 0.6) glints++;
      sp = Math.max(sp, spec);
    } else {
      const env = Math.pow(0.5 + 0.5 * Math.sin(ry * 5 + rx * 2.5 + 1), 5);
      b = 0.1 + 0.35 * lam + 0.7 * Math.pow(rd, 3) + 0.3 * Math.pow(1 - Math.abs(nz2), 2) + 0.55 * env;
    }
    const dh = head - aORD[i];
    if (dh < 0.12 && head < ORDER_MAX + 0.08) b += 0.7 * (1 - Math.max(dh, 0) / 0.12);
    zb[idx] = z2; br[idx] = b * (0.35 + 0.65 * ks); nxb[idx] = nx1; nyb[idx] = ny2;
    kb[idx] = kd + 1; fb[idx] = aFID[i]; arr[idx] = ks; spb[idx] = sp;
  }
  /* ---- close single-cell holes ---- */
  {
    const fill = [];
    for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) {
      const idx = r * COLS + c; if (kb[idx]) continue;
      if (kb[idx - 1] && kb[idx + 1] && arr[idx - 1] > 0.88 && arr[idx + 1] > 0.88) fill.push(idx, idx - 1);
      else if (kb[idx - COLS] && kb[idx + COLS] && arr[idx - COLS] > 0.88 && arr[idx + COLS] > 0.88) fill.push(idx, idx - COLS);
    }
    for (let i = 0; i < fill.length; i += 2) {
      const d = fill[i], s = fill[i + 1];
      kb[d] = kb[s]; br[d] = br[s]; nxb[d] = nxb[s]; nyb[d] = nyb[s]; fb[d] = fb[s]; arr[d] = arr[s]; spb[d] = spb[s];
    }
    for (let i = 0; i < kb.length; i++) oc[i] = (kb[i] && arr[i] >= 0.88) ? 1 : 0;
  }

  /* ---- draw ---- */
  msg.style.opacity = (smooth((t - 6.4) / 1.4) * GA * (0.88 + 0.12 * Math.sin(t * 2.2))).toFixed(3);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.font = FONT(FS); ctx.textBaseline = "top";

  // dust
  ctx.fillStyle = "#cfd6e2";
  for (const d of dust) {
    if (kb[d.r * COLS + d.c]) continue;
    glyph(d.ch, d.c, d.r, d.a * (0.45 + 0.55 * Math.sin(t * 1.4 + d.p)));
  }
  // gem centre on screen
  const gem = project(0, 1.38 * cT, 1.38 * sT);
  const gcol = Math.floor(gem[0] / CW), grow = Math.floor(gem[1] / CH);
  const top = project(0, TABLE_Y * cT, TABLE_Y * sT);
  const tcol = Math.floor(top[0] / CW), trow = Math.floor(top[1] / CH);

  // shockwave — rings of dots when the stone lands
  {
    const dt = t - (DRAW1 - 0.3);
    if (dt > 0 && dt < 3.2) for (let j = 0; j < 3; j++) {
      const rad = (dt - j * 0.28) * 2.1;
      if (rad < 0.05 || rad > 4.2) continue;
      const al = (1 - rad / 4.2) * 0.5 * (1 - j * 0.22), pr = rad * S;
      const n = Math.max(14, Math.floor(TAU * pr / CW / 1.5));
      ctx.fillStyle = "#cfd6e2";
      for (let s = 0; s < n; s++) {
        const th = TAU * s / n + j;
        const c = Math.floor((gem[0] + Math.cos(th) * pr) / CW), r = Math.floor((gem[1] + Math.sin(th) * pr) / CH);
        if (c < 0 || c >= COLS || r < 0 || r >= ROWS || kb[r * COLS + c]) continue;
        glyph(hash(s, j) > 0.7 ? ":" : ".", c, r, al * (0.3 + 0.7 * hash(s + fr, j)));
      }
    }
  }
  // orbits — two wide ellipses, like an atom
  {
    const oa = smooth((t - 6.3) / 1.4);
    if (oa > 0) {
      ctx.fillStyle = "#cfd6e2";
      for (let e = 0; e < 2; e++) {
        for (let u = 0; u < ORB_N; u++) {
          const th = TAU * u / ORB_N, p = orbitPoint(e, th, t), s = project(p[0], p[1], p[2]);
          const c = Math.floor(s[0] / CW), r = Math.floor(s[1] / CH);
          if (c < 0 || c >= COLS || r < 0 || r >= ROWS || kb[r * COLS + c]) continue;
          const pulse = Math.pow(0.5 + 0.5 * Math.sin(th * 2 - t * 2 + e * 3), 10);
          const hh = hash(u, e + 31);
          glyph(pulse > 0.5 && hh > 0.5 ? "8%&"[(hh * 6) | 0 % 3] || "8" : "'.:+`"[(hh * 5) | 0], c, r, oa * (0.26 + 0.6 * pulse) * (p[2] > 0 ? 1 : 0.75));
        }
        // travelling sparks
        const base = t * 0.9 + e * PI;
        for (let j = 0; j < 7; j++) {
          const p = orbitPoint(e, base - j * 0.045, t), s = project(p[0], p[1], p[2]);
          glyph("@8*+:.."[j], Math.floor(s[0] / CW), Math.floor(s[1] / CH), oa * (1 - j / 7), "#fff");
        }
      }
    }
  }
  // light beams: a fan above the table, a stem under the ring
  {
    const ba = smooth((head - 1.75) / 0.2);
    if (ba > 0) {
      ctx.fillStyle = "#e8eeff";
      for (let ri = -4; ri <= 4; ri++) {
        const ang2 = ri * 0.11, Lr = 7 + 8 * (1 - Math.abs(ri) / 5) + 2 * Math.sin(t * 3 + ri);
        for (let d = 1; d < Lr; d++) {
          const c = tcol + Math.round(d * Math.tan(ang2) * CH / CW);
          glyph(ri === 0 ? "|" : ri < 0 ? "\\" : "/", c, trow - d - 1, ba * (0.18 + 0.3 * Math.abs(Math.sin(t * 6 + ri * 2.3))) * (1 - d / Lr));
        }
      }
      const bot = project(0, -R_BAND * cT - 0.12, -R_BAND * sT * -1);
      const bc = Math.floor(bot[0] / CW), br0 = Math.floor(bot[1] / CH);
      for (let d = 0; d < 11; d++) glyph("|", bc, br0 + d, ba * 0.35 * (1 - d / 11) * (0.7 + 0.3 * Math.sin(t * 5)));
    }
  }

  // ring, with reflection
  let letters = 0;
  const cand = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const idx = r * COLS + c, kd = kb[idx]; if (!kd) continue;
    const a = arr[idx];
    let ch, al, b = br[idx];
    if (a < 0.88) {
      ch = SCAT[(hash(c + fr, r) * SCAT.length) | 0]; al = 0.2 + 0.8 * a; b = 0.4;
    } else {
      letters++;
      let edge = false;
      const n1 = occ(c - 1, r - 1), n2 = occ(c, r - 1), n3 = occ(c + 1, r - 1), n4 = occ(c - 1, r), n6 = occ(c + 1, r), n7 = occ(c - 1, r + 1), n8 = occ(c, r + 1), n9 = occ(c + 1, r + 1);
      const cnt = n1 + n2 + n3 + n4 + n6 + n7 + n8 + n9;
      if (cnt <= 6) {
        const gxr = ((n3 + 2 * n6 + n9) - (n1 + 2 * n4 + n7)) * CH / CW * 0.5, gyr = (n7 + 2 * n8 + n9) - (n1 + 2 * n2 + n3);
        const ax = Math.abs(gxr), ay = Math.abs(gyr);
        if (ax + ay > 0.5) {
          const hh = hash(c, r);
          if (ay > 2.2 * ax) ch = gyr > 0 ? (hh < 0.55 ? "-" : hh < 0.85 ? "~" : "=") : (hh < 0.75 ? "_" : "-");
          else if (ax > 2.2 * ay) ch = gxr > 0 ? (hh < 0.5 ? "|" : hh < 0.75 ? "(" : hh < 0.9 ? "[" : "{") : (hh < 0.5 ? "|" : hh < 0.75 ? ")" : hh < 0.9 ? "]" : "}");
          else ch = gxr * gyr > 0 ? "/" : "\\";
          b = Math.max(b, 0.5) + 0.2; edge = true;
        }
      }
      if (!edge && kd === KG + 1) {
        const fR = (c + 1 < COLS && kb[idx + 1] === kd) ? fb[idx + 1] : -1, fD = (r + 1 < ROWS && kb[idx + COLS] === kd) ? fb[idx + COLS] : -1;
        const dR = fR >= 0 && fR !== fb[idx], dD = fD >= 0 && fD !== fb[idx];
        if ((dR || dD) && hash(c * 3, r * 7) < 0.7) { ch = dR && dD ? (nxb[idx] > 0 ? "/" : "\\") : dR ? "|" : "-"; b = Math.max(b, 0.6) + 0.15; }
      }
      if (!ch) {
        let ci = Math.floor(clamp(b, 0, 1) * (RAMP.length - 2)) + 1 + Math.round((hash(c, r + ((t * 5) | 0)) - 0.5) * 2.4);
        ch = RAMP[clamp(ci, 1, RAMP.length - 1)];
      }
      al = 0.2 + b * 0.9;
      if (kd === KG + 1 && spb[idx] > 0.55) cand.push(c, r, spb[idx]);
    }
    ctx.fillStyle = b > 1.0 ? "#ffffff" : (kd === KG + 1 ? "#e4eaff" : "#d3d9e6");
    glyph(ch, c, r, al);
    // mirrored reflection on the floor
    const rr = groundRow + Math.round((groundRow - r) * 0.4);
    if (rr > groundRow && rr < ROWS) {
      const fade = 1 - (rr - groundRow) / 16;
      if (fade > 0) { ctx.fillStyle = "#cfd6e2"; glyph(REFL[(hash(c, r + 9) * REFL.length) | 0], c, rr, 0.13 * fade * Math.min(1, b)); }
    }
  }
  // glint stars on the strongest facets
  cand.sort;
  const chosen = [];
  for (let i = 0; i < cand.length; i += 3) {
    if (chosen.length >= 9) break;
    let ok = true;
    for (const s of chosen) if (Math.abs(s[0] - cand[i]) < 4 && Math.abs(s[1] - cand[i + 1]) < 3) { ok = false; break; }
    if (ok && hash(cand[i] + fr * 0, cand[i + 1]) < 0.6) chosen.push([cand[i], cand[i + 1], Math.min(1, cand[i + 2])]);
  }
  for (const s of chosen) star(s[0], s[1], s[2]);
  ctx.globalAlpha = 1;

  // glow copy at half resolution
  gctx.clearRect(0, 0, glow.width, glow.height);
  gctx.drawImage(main, 0, 0, glow.width, glow.height);

  /* ---- HUD + code ---- */
  const deg = ((ang * 180 / PI) % 360).toFixed(2).padStart(6, "0");
  const ht = `@you · 2026\nrotation ${deg}°   glints ${String(glints).padStart(3, " ")}\nletters ${letters.toLocaleString("en-US").padStart(5, "0")}`;
  if (ht !== hudTxt) { hud.textContent = ht; hudTxt = ht; }
  const ct = `● t ${t.toFixed(2).padStart(5, "0")}s`;
  if (ct !== clockTxt) { clock.textContent = ct; clockTxt = ct; }
  const x = clamp(t / TYPE_END, 0, 1);
}
requestAnimationFrame(frame);
})();
</script>
